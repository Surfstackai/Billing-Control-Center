<template>
    <section class={containerClass}>
        <template if:false={compact}>
            <div class="bcc-date-filter__header">
                <p class="bcc-date-filter__eyebrow">Date Filter</p>
            </div>
        </template>
        <div class="bcc-date-filter__controls">
            <lightning-combobox
                class="bcc-date-filter__select"
                label="Date Filter"
                variant={comboboxVariant}
                value={currentFilterKey}
                options={options}
                onchange={handleFilterChange}>
            </lightning-combobox>
        </div>
    </section>
</template>
