<template>
    <div class="control-center-card">
        <div class={heroClass}>
            <template if:true={showHeroIntro}>
                <div class="hero__intro">
                    <p class="hero__eyebrow">Billing Control Center</p>
                    <h1 class="hero__title">{heroTitle}</h1>
                    <p class="hero__subtitle">{heroSubtitle}</p>
                </div>
            </template>
            <div class="hero__controls">
                <c-billing-control-center-date-filter
                    compact
                    label="Actual Completion Date"
                    selected-filter-key={dateFilterKey}
                    start-date={dateFilterStart}
                    end-date={dateFilterEnd}
                    ondatefilterchange={handleDateFilterChange}>
                </c-billing-control-center-date-filter>
                <lightning-record-picker
                    class="owner-picker"
                    label="Opportunity Owner"
                    placeholder="Opportunity Owner"
                    object-api-name="User"
                    value={opportunityOwnerId}
                    display-info={userPickerDisplayInfo}
                    matching-info={userPickerMatchingInfo}
                    onchange={handleOpportunityOwnerChange}>
                </lightning-record-picker>
                <lightning-input
                    class="toolbar-search"
                    type="search"
                    label="Search"
                    variant="label-hidden"
                    placeholder="Search opportunity, quote, account, or visit"
                    value={searchKey}
                    onchange={handleSearchChange}>
                </lightning-input>
                <c-billing-control-center-action-bar
                    actions={tableActions}
                    onactionclick={handleTableActionClick}>
                </c-billing-control-center-action-bar>
                <template if:true={useExternalToolbar}>
                    <lightning-button
                        label={toolbarRefreshLabel}
                        icon-name="utility:refresh"
                        variant="neutral"
                        disabled={isToolbarBusy}
                        onclick={handleRefresh}>
                    </lightning-button>
                </template>
                <template if:false={useExternalToolbar}>
                    <c-billing-control-center-action-bar
                        actions={heroActions}
                        onactionclick={handleHeroActionClick}>
                    </c-billing-control-center-action-bar>
                </template>
            </div>
        </div>

        <template if:true={errorMessage}>
            <div class="slds-p-horizontal_large slds-p-bottom_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </div>
        </template>

        <c-billing-control-center-diagnostics
            warnings={diagnosticWarnings}
            title="Configuration warnings detected"
            is-visible={showDiagnostics}>
        </c-billing-control-center-diagnostics>

        <template if:true={showFullPageSpinner}>
            <lightning-spinner alternative-text="Refreshing data" size="small"></lightning-spinner>
        </template>

        <div class="billing-kpi-container">
            <c-billing-control-center-kpi-grid
                tiles={kpiTiles}
                selected-key={selectedKpiKey}
                ontileclick={handleKpiTileClick}>
            </c-billing-control-center-kpi-grid>
            <p class="bcc-kpi-legend">{kpiLegendText}</p>
            <p class="bcc-kpi-legend">{overlapLegendText}</p>
        </div>

        <template if:true={showTableShell}>
            <section class="table-shell billing-console-shell">
                <div class="billing-tab-panel">
                    <div class="table-meta">
                        <span><lightning-formatted-number value={billableCount}></lightning-formatted-number> Opportunities</span>
                        <span><lightning-formatted-number value={selectedOpportunityCount}></lightning-formatted-number> Opportunities Selected</span>
                        <span>{searchSummary}</span>
                    </div>

                    <lightning-accordion
                        class="bucket-accordion"
                        allow-multiple-sections-open
                        active-section-name={activeSectionNames}>
                        <template for:each={visibleAccordionSections} for:item="section">
                            <lightning-accordion-section
                                key={section.categoryKey}
                                name={section.categoryKey}
                                label={section.titleWithCount}>
                                <div class="bucket-section-body">
                                    <template if:true={section.showCountCaption}>
                                        <p class="bucket-count-caption">{section.countCaption}</p>
                                    </template>
                                    <template if:true={section.isEmpty}>
                                        <p class="bucket-empty">No Opportunities in this readiness list for the current filters.</p>
                                    </template>
                                    <template if:false={section.isEmpty}>
                                        <div class="slds-scrollable_x bucket-table-host">
                                            <table
                                                class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout grouped-diary-table"
                                                aria-label={section.categoryLabel}>
                                                <colgroup>
                                                    <col class="grouped-diary-table__col grouped-diary-table__col--select" />
                                                    <template for:each={section.columns} for:item="column">
                                                        <col key={column.key} class={column.colClass} style={column.colStyle} />
                                                    </template>
                                                </colgroup>
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th scope="col" class="grouped-diary-table__header grouped-diary-table__header--select">
                                                            <span class="slds-truncate" title="Select">Select</span>
                                                        </th>
                                                        <template for:each={section.columns} for:item="column">
                                                            <th
                                                                key={column.key}
                                                                scope="col"
                                                                class={column.headerClass}
                                                                style={column.headerStyle}
                                                                aria-sort={column.ariaSort}>
                                                                <button
                                                                    class="slds-button slds-button_reset slds-grid slds-grid_align-spread grouped-diary-table__header-button"
                                                                    type="button"
                                                                    data-bucket={section.categoryKey}
                                                                    data-field={column.fieldName}
                                                                    onclick={handleHeaderSort}>
                                                                    <span class="grouped-diary-table__header-label" title={column.label}>{column.label}</span>
                                                                    <template if:true={column.isSorted}>
                                                                        <lightning-icon
                                                                            icon-name={column.sortIcon}
                                                                            size="xx-small"
                                                                            alternative-text={column.sortAltText}>
                                                                        </lightning-icon>
                                                                    </template>
                                                                </button>
                                                                <span
                                                                    class="bcc-column-resize-handle"
                                                                    data-column-key={column.developerKey}
                                                                    onmousedown={handleColumnResizeStart}
                                                                    title="Resize column"></span>
                                                            </th>
                                                        </template>
                                                    </tr>
                                                </thead>
                                                <template for:each={section.filteredRows} for:item="row">
                                                <tbody key={row.rowKey}>
                                                        <tr class={row.rowClass}>
                                                            <td class="grouped-diary-table__cell grouped-diary-table__cell--select" data-label="Select">
                                                                <lightning-input
                                                                    type="checkbox"
                                                                    variant="label-hidden"
                                                                    label={row.opportunityName}
                                                                    data-bucket={section.categoryKey}
                                                                    data-row-key={row.rowKey}
                                                                    checked={row.isSelected}
                                                                    onchange={handleGroupSelection}>
                                                                </lightning-input>
                                                            </td>
                                                            <template for:each={section.columns} for:item="column">
                                                                <td key={column.key} class={column.cellClass} data-label={column.label}>
                                                                    <template if:true={column.isAccount}>
                                                                        <template if:true={row.showAccountName}>
                                                                            <div class="grouped-diary-table__single-value" title={row.accountName}>
                                                                                <template if:true={row.accountUrl}>
                                                                                    <a
                                                                                        href={row.accountUrl}
                                                                                        target="_blank"
                                                                                        rel="noopener noreferrer"
                                                                                        class="slds-text-link grouped-diary-table__single-link"
                                                                                        title={row.accountName}>
                                                                                        {row.accountName}
                                                                                    </a>
                                                                                </template>
                                                                                <template if:false={row.accountUrl}>
                                                                                    <span class="grouped-diary-table__single-text">{row.accountName}</span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </template>

                                                                    <template if:true={column.isOpportunity}>
                                                                        <div class="grouped-diary-table__single-value" title={row.opportunityName}>
                                                                            <template if:true={row.opportunityUrl}>
                                                                                <a
                                                                                    href={row.opportunityUrl}
                                                                                    target="_blank"
                                                                                    rel="noopener noreferrer"
                                                                                    class="slds-text-link grouped-diary-table__single-link"
                                                                                    title={row.opportunityName}>
                                                                                    {row.opportunityName}
                                                                                </a>
                                                                            </template>
                                                                            <template if:false={row.opportunityUrl}>
                                                                                <span class="grouped-diary-table__single-text">{row.opportunityName}</span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isQuoteNumber}>
                                                                        <div class="grouped-diary-table__single-value" title={row.quoteNumber}>
                                                                            <span class="grouped-diary-table__single-text">{row.quoteNumber}</span>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isReasons}>
                                                                        <div class="grouped-diary-cell grouped-diary-cell--truncate" title={row.reasonDisplay}>
                                                                            <template if:true={row.showReviewBanner}>
                                                                                <span class="slds-badge slds-theme_warning slds-m-bottom_xx-small">Needs Review</span>
                                                                            </template>
                                                                            <span class="grouped-diary-table__single-text">{row.reasonDisplay}</span>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isInvoiceNumber}>
                                                                        <div class="grouped-diary-cell grouped-diary-cell--invoice-number">
                                                                            <template for:each={row.invoices} for:item="chip">
                                                                                <div key={chip.lineKey} class="grouped-diary-cell__line">
                                                                                    <span
                                                                                        class="grouped-diary-cell__value grouped-diary-cell__value--truncate"
                                                                                        title={chip.invoiceNumber}>
                                                                                        {chip.chipLabel}
                                                                                    </span>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isWorkOrder}>
                                                                        <div class="grouped-diary-table__single-value" title={row.workOrderNumber}>
                                                                            <template if:true={row.workOrderUrl}>
                                                                                <a
                                                                                    href={row.workOrderUrl}
                                                                                    target="_blank"
                                                                                    rel="noopener noreferrer"
                                                                                    class="slds-text-link grouped-diary-table__single-link"
                                                                                    title={row.workOrderNumber}>
                                                                                    {row.workOrderNumber}
                                                                                </a>
                                                                            </template>
                                                                            <template if:false={row.workOrderUrl}>
                                                                                <span class="grouped-diary-table__single-text">{row.workOrderNumber}</span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isServiceAppointment}>
                                                                        <div class="grouped-diary-table__single-value">
                                                                            <lightning-button
                                                                                variant="base"
                                                                                label={row.evidenceToggleLabel}
                                                                                data-row-key={row.rowKey}
                                                                                onclick={handleToggleEvidence}>
                                                                            </lightning-button>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isCreatedDate}>
                                                                        <div class="grouped-diary-cell grouped-diary-cell--nowrap">
                                                                            <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                                <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                    <div class="grouped-diary-cell__value grouped-diary-cell__value--nowrap">
                                                                                        <lightning-formatted-date-time
                                                                                            value={appointment.createdDateValue}
                                                                                            year="numeric"
                                                                                            month="2-digit"
                                                                                            day="2-digit">
                                                                                        </lightning-formatted-date-time>
                                                                                    </div>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isSubject}>
                                                                        <div class="grouped-diary-cell grouped-diary-cell--truncate">
                                                                            <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                                <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                    <span
                                                                                        class="grouped-diary-cell__value grouped-diary-cell__value--truncate"
                                                                                        title={appointment.subject}>
                                                                                        {appointment.subject}
                                                                                    </span>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isStatus}>
                                                                        <div class="grouped-diary-cell grouped-diary-cell--nowrap">
                                                                            <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                                <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                    <span class="grouped-diary-cell__value grouped-diary-cell__value--nowrap">
                                                                                        {appointment.status}
                                                                                    </span>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isOpportunityAmount}>
                                                                        <div class="grouped-diary-table__grouped-amount">
                                                                            <template if:true={row.hasOpportunityAmount}>
                                                                                <lightning-formatted-number
                                                                                    value={row.opportunityAmountValue}
                                                                                    format-style="currency"
                                                                                    currency-code="USD">
                                                                                </lightning-formatted-number>
                                                                            </template>
                                                                            <template if:false={row.hasOpportunityAmount}>
                                                                                <span class="slds-badge" title="Quoted amount is missing">No amount</span>
                                                                            </template>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isInvoicedTotal}>
                                                                        <div class="grouped-diary-table__grouped-amount">
                                                                            <lightning-formatted-number
                                                                                value={row.invoicedTotal}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isRemaining}>
                                                                        <div class="grouped-diary-table__grouped-amount">
                                                                            <lightning-formatted-number
                                                                                value={row.remaining}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isPaidTotal}>
                                                                        <div class="grouped-diary-table__grouped-amount">
                                                                            <lightning-formatted-number
                                                                                value={row.paidTotal}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isOutstandingAmount}>
                                                                        <div class="grouped-diary-table__grouped-amount">
                                                                            <lightning-formatted-number
                                                                                value={row.outstanding}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isBillingStatus}>
                                                                        <div class="grouped-diary-table__single-value" title={row.billingStatus}>
                                                                            <span class="grouped-diary-table__single-text">{row.billingStatus}</span>
                                                                        </div>
                                                                    </template>

                                                                    <template if:true={column.isOwner}>
                                                                        <div class="grouped-diary-table__single-value" title={row.ownerName}>
                                                                            <span class="grouped-diary-table__single-text">{row.ownerName}</span>
                                                                        </div>
                                                                    </template>
                                                                    <template if:true={column.isFlags}>
                                                                        <div class="grouped-diary-table__flags">
                                                                            <template for:each={row.flagItems} for:item="flagItem">
                                                                                <lightning-icon
                                                                                    key={flagItem.key}
                                                                                    icon-name={flagItem.iconName}
                                                                                    size="xx-small"
                                                                                    alternative-text={flagItem.title}
                                                                                    title={flagItem.title}
                                                                                    class="slds-m-right_xx-small">
                                                                                </lightning-icon>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                    <template if:true={column.isLedgerAction}>
                                                                        <div class="ledger-action" data-ledger-id={row.ledgerId}>
                                                                            <lightning-button
                                                                                label="View Ledger"
                                                                                variant="neutral"
                                                                                onclick={handleViewLedger}
                                                                                disabled={row.isLedgerActionDisabled}>
                                                                            </lightning-button>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                        </tr>
                                                        <template if:true={row.isExpanded}>
                                                            <tr>
                                                                <td class="evidence-tree" colspan="20">
                                                                    <template if:true={row.showReviewBanner}>
                                                                        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-m-bottom_small" role="status">
                                                                            Accounting needs to review this Opportunity. {row.reasonDisplay}
                                                                        </div>
                                                                    </template>
                                                                    <template for:each={row.workOrders} for:item="workOrder">
                                                                        <div key={workOrder.workOrderId} class="evidence-tree__work-order">
                                                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                                                                <strong>{workOrder.workOrderNumber}</strong>
                                                                                <span class="slds-m-left_x-small slds-text-color_weak">{workOrder.status}</span>
                                                                                <template if:true={workOrder.ledgerId}>
                                                                                    <div class="ledger-action slds-m-left_small" data-ledger-id={workOrder.ledgerId}>
                                                                                    <lightning-button
                                                                                        label="View Ledger"
                                                                                        variant="base"
                                                                                        onclick={handleViewLedger}>
                                                                                    </lightning-button>
                                                                                    </div>
                                                                                </template>
                                                                            </div>
                                                                            <template if:true={workOrder.description}>
                                                                                <p class="slds-text-body_small">{workOrder.description}</p>
                                                                            </template>
                                                                            <template if:true={workOrder.serviceNote}>
                                                                                <p class="slds-text-body_small">Service note: {workOrder.serviceNote}</p>
                                                                            </template>
                                                                            <template if:true={workOrder.internalServiceNote}>
                                                                                <p class="slds-text-body_small">Internal note: {workOrder.internalServiceNote}</p>
                                                                            </template>
                                                                            <template if:true={workOrder.invoiceNumberHint}>
                                                                                <p class="slds-text-body_small slds-text-color_weak">Field note: {workOrder.invoiceNumberHint}</p>
                                                                            </template>
                                                                            <template if:true={workOrder.legacyDepositPayments}>
                                                                                <p class="slds-text-body_small slds-text-color_weak">Legacy deposit: {workOrder.legacyDepositPayments} {workOrder.legacyDepositAmount}</p>
                                                                            </template>
                                                                            <template for:each={workOrder.appointments} for:item="appointment">
                                                                                <div key={appointment.serviceAppointmentId} class="evidence-tree__appointment slds-m-left_medium">
                                                                                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                                                                        <template if:true={appointment.canSelectAsEvidence}>
                                                                                            <lightning-input
                                                                                                type="checkbox"
                                                                                                variant="label-hidden"
                                                                                                label={appointment.evidenceSelectLabel}
                                                                                                data-sa-id={appointment.serviceAppointmentId}
                                                                                                checked={appointment.isEvidenceSelected}
                                                                                                onchange={handleEvidenceSaChange}>
                                                                                            </lightning-input>
                                                                                        </template>
                                                                                        <span>{appointment.serviceAppointmentNumber}</span>
                                                                                        <span class="slds-m-left_x-small slds-text-color_weak">{appointment.status}</span>
                                                                                        <template if:true={appointment.operationalUnassigned}>
                                                                                            <span class="slds-m-left_x-small slds-text-color_weak">Not assigned</span>
                                                                                        </template>
                                                                                        <template if:true={appointment.actualEndTimeDisplay}>
                                                                                            <span class="slds-m-left_x-small slds-text-color_weak">{appointment.actualEndTimeDisplay}</span>
                                                                                        </template>
                                                                                        <template if:true={appointment.billed}>
                                                                                            <span class="slds-m-left_x-small">Billed? Yes · {appointment.billedInvoiceNumber}</span>
                                                                                        </template>
                                                                                        <template if:false={appointment.billed}>
                                                                                            <span class="slds-m-left_x-small">Billed? No</span>
                                                                                        </template>
                                                                                        <template if:true={appointment.technicianName}>
                                                                                            <span class="slds-m-left_x-small slds-text-color_weak">{appointment.technicianName}</span>
                                                                                        </template>
                                                                                        <lightning-button
                                                                                            class="slds-m-left_small"
                                                                                            label={appointment.flagReviewLabel}
                                                                                            variant="base"
                                                                                            disabled={appointment.isFlaggedForReview}
                                                                                            data-sa-id={appointment.serviceAppointmentId}
                                                                                            onclick={handleFlagForReview}>
                                                                                        </lightning-button>
                                                                                    </div>
                                                                                    <template if:true={appointment.description}>
                                                                                        <p class="slds-text-body_small">{appointment.description}</p>
                                                                                    </template>
                                                                                    <template if:true={appointment.serviceNote}>
                                                                                        <p class="slds-text-body_small">Service note: {appointment.serviceNote}</p>
                                                                                    </template>
                                                                                    <template if:true={appointment.internalServiceNote}>
                                                                                        <p class="slds-text-body_small">Internal note: {appointment.internalServiceNote}</p>
                                                                                    </template>
                                                                                    <template if:true={appointment.invoiceNumberHint}>
                                                                                        <p class="slds-text-body_small slds-text-color_weak">Field note: {appointment.invoiceNumberHint}</p>
                                                                                    </template>
                                                                                    <template if:true={appointment.woInvStatusHint}>
                                                                                        <p class="slds-text-body_small slds-text-color_weak">WO inv status: {appointment.woInvStatusHint}</p>
                                                                                    </template>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                </tbody>
                                                    </template>
                                            </table>
                                        </div>
                                    </template>
                                </div>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                </div>
            </section>
        </template>
    </div>

    <template if:true={isCompleteBillingModalOpen}>
        <c-billing-control-center-invoice-modal
            service-appointments={completeBillingModalSelections}
            context-opportunity-id={invoiceModalOpportunityId}
            onclose={handleCompleteBillingClose}
            onsuccess={handleCompleteBillingSuccess}
            onviewledger={handleInvoiceViewLedger}>
        </c-billing-control-center-invoice-modal>
    </template>

    <template if:true={showLedgerModal}>
        <c-billing-control-center-ledger-modal
            ledger-id={selectedLedgerId}
            onclose={handleCloseLedgerModal}>
        </c-billing-control-center-ledger-modal>
    </template>
</template>
