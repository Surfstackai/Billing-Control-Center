<template>
    <div class="control-center-card">
        <div class={heroClass}>
            <template if:true={showHeroIntro}>
                <div class="hero__intro">
                    <p class="hero__eyebrow">Billing Control Center</p>
                    <h1 class="hero__title">{heroTitle}</h1>
                    <p class="hero__subtitle">{heroSubtitle}</p>
                </div>
            </template>
            <div class="hero__controls">
                <div class="view-by">
                    <p class="view-by__title">View by</p>
                    <div class="view-by__switch" role="group" aria-label="View by">
                        <button
                            type="button"
                            class={salespersonViewButtonClass}
                            data-view="salesperson"
                            aria-pressed={isSalespersonView}
                            onclick={handleViewChange}>
                            Salesperson
                        </button>
                        <button
                            type="button"
                            class={invoiceViewButtonClass}
                            data-view="invoice"
                            aria-pressed={isInvoiceView}
                            onclick={handleViewChange}>
                            Invoice
                        </button>
                        <span class={viewSwitchKnobClass} aria-hidden="true"></span>
                    </div>
                </div>
                <c-billing-control-center-date-filter
                    compact
                    label="Due date"
                    selected-filter-key={dateFilterKey}
                    start-date={dateFilterStart}
                    end-date={dateFilterEnd}
                    ondatefilterchange={handleDateFilterChange}>
                </c-billing-control-center-date-filter>
                <lightning-record-picker
                    class="owner-picker"
                    label="Opportunity Owner"
                    placeholder="Opportunity Owner"
                    object-api-name="User"
                    value={opportunityOwnerId}
                    display-info={userPickerDisplayInfo}
                    matching-info={userPickerMatchingInfo}
                    onchange={handleOpportunityOwnerChange}>
                </lightning-record-picker>
                <lightning-input
                    class="toolbar-search"
                    type="search"
                    label="Search"
                    variant="label-hidden"
                    placeholder="Search invoice, quote, account, opportunity, salesperson"
                    value={searchKey}
                    onchange={handleSearchChange}>
                </lightning-input>
                <c-billing-control-center-action-bar
                    actions={tableActions}
                    onactionclick={handleTableActionClick}>
                </c-billing-control-center-action-bar>
                <template if:true={useExternalToolbar}>
                    <lightning-button
                        label={toolbarRefreshLabel}
                        icon-name="utility:refresh"
                        variant="neutral"
                        disabled={isLoading}
                        onclick={handleRefresh}>
                    </lightning-button>
                </template>
                <template if:false={useExternalToolbar}>
                    <c-billing-control-center-action-bar
                        actions={heroActions}
                        onactionclick={handleHeroActionClick}>
                    </c-billing-control-center-action-bar>
                </template>
            </div>
        </div>

        <template if:true={errorMessage}>
            <div class="slds-p-horizontal_large slds-p-bottom_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </div>
        </template>

        <c-billing-control-center-diagnostics
            warnings={providerWarnings}
            title="Configuration warnings detected"
            is-visible={showDiagnostics}>
        </c-billing-control-center-diagnostics>

        <template if:true={showFullPageSpinner}>
            <lightning-spinner alternative-text="Refreshing receivables" size="small"></lightning-spinner>
        </template>

        <div class="ar-summary-strip" role="tablist" aria-label="Receivable status">
            <template for:each={statusStripItems} for:item="item">
                <button
                    key={item.key}
                    class={item.className}
                    type="button"
                    role="tab"
                    aria-selected={item.ariaSelected}
                    data-status={item.developerKey}
                    onclick={handleStatusStripClick}>
                    <span class="ar-summary-strip__label">{item.title}</span>
                    <span class="ar-summary-strip__metric">{item.metricText}</span>
                    <span class="ar-summary-strip__count">{item.countText}</span>
                </button>
            </template>
        </div>

        <template if:true={showTableShell}>
            <section class="table-shell billing-console-shell">
                <div class="billing-tab-panel">
                    <div class="table-meta">
                        <span><lightning-formatted-number value={visibleInvoiceCount}></lightning-formatted-number> Invoices</span>
                        <span><lightning-formatted-number value={selectedCount}></lightning-formatted-number> Selected</span>
                        <span>{searchSummary}</span>
                        <span>{statusFilterLabel}</span>
                    </div>

                    <template if:true={isSalespersonView}>
                        <template if:true={salespersonGroupsEmpty}>
                            <p class="bucket-empty">No invoices match the current filters.</p>
                        </template>
                        <template for:each={salespersonGroups} for:item="group">
                            <article key={group.key} class={group.cardClass}>
                                <div class="salesperson-card__bar">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label={group.selectLabel}
                                        data-key={group.key}
                                        checked={group.isSelected}
                                        onchange={handleParentSelection}>
                                    </lightning-input>
                                    <button
                                        class="salesperson-card__toggle"
                                        type="button"
                                        data-key={group.key}
                                        aria-expanded={group.ariaExpanded}
                                        onclick={handleToggleRow}>
                                        <span class="salesperson-card__identity">
                                            <span class="salesperson-card__name">{group.ownerName}</span>
                                            <lightning-icon
                                                icon-name={group.expandIcon}
                                                size="xx-small"
                                                alternative-text={group.expandAltText}>
                                            </lightning-icon>
                                        </span>
                                        <span class="salesperson-card__metrics">
                                            <span class="salesperson-card__metric">
                                                <lightning-formatted-number value={group.outstandingAr} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                                                <span class="salesperson-card__metric-label">Outstanding</span>
                                            </span>
                                            <span class="salesperson-card__metric">
                                                <lightning-formatted-number value={group.overdue} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                                                <span class="salesperson-card__metric-label">Overdue</span>
                                            </span>
                                            <span class="salesperson-card__metric">
                                                <lightning-formatted-number value={group.invoiceCount}></lightning-formatted-number>
                                                <span class="salesperson-card__metric-label">invoices</span>
                                            </span>
                                        </span>
                                        <span class="salesperson-card__secondary">
                                            <span class="salesperson-card__metric">
                                                <lightning-formatted-number value={group.partiallyPaid} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                                                <span class="salesperson-card__metric-label">Partially paid ({group.partiallyPaidCount})</span>
                                            </span>
                                        </span>
                                    </button>
                                </div>
                                <template if:true={group.isExpanded}>
                                    <div class="salesperson-card__body">
                                        <template if:true={group.isEmpty}>
                                            <p class="bucket-empty">No invoices in this status for this salesperson.</p>
                                        </template>
                                        <template if:false={group.isEmpty}>
                                            <div class="slds-scrollable_x bucket-table-host">
                                                <table class="slds-table slds-table_bordered slds-table_fixed-layout grouped-diary-table receivables-table" aria-label={group.tableLabel}>
                                                    <colgroup>
                                                        <col style={receivableColumnStyles.select} />
                                                        <col style={receivableColumnStyles.invoice} />
                                                        <col style={receivableColumnStyles.account} />
                                                        <col style={receivableColumnStyles.type} />
                                                        <col style={receivableColumnStyles.invoiceDate} />
                                                        <col style={receivableColumnStyles.dueDate} />
                                                        <col style={receivableColumnStyles.days} />
                                                        <col style={receivableColumnStyles.amount} />
                                                        <col style={receivableColumnStyles.paid} />
                                                        <col style={receivableColumnStyles.balance} />
                                                        <col style={receivableColumnStyles.status} />
                                                    </colgroup>
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.select}>
                                                                <span class="slds-assistive-text">Selection and expansion</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="select" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.invoice}>
                                                                <span class="grouped-diary-table__header-label">Invoice</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="invoice" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.account}>
                                                                <span class="grouped-diary-table__header-label">Account</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="account" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.type}>
                                                                <span class="grouped-diary-table__header-label">Type</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="type" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.invoiceDate}>
                                                                <span class="grouped-diary-table__header-label">Invoice Date</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="invoiceDate" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.dueDate}>
                                                                <span class="grouped-diary-table__header-label">Due Date</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="dueDate" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.days}>
                                                                <span class="grouped-diary-table__header-label">Days</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="days" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.amount}>
                                                                <span class="grouped-diary-table__header-label">Amount</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="amount" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.paid}>
                                                                <span class="grouped-diary-table__header-label">Paid</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="paid" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.balance}>
                                                                <span class="grouped-diary-table__header-label">Balance</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="balance" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.status}>
                                                                <span class="grouped-diary-table__header-label">Status</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="status" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={group.invoices} for:item="invoice">
                                                            <tr key={invoice.key} class="slds-hint-parent">
                                                                <td>
                                                                    <div class="slds-grid slds-grid_vertical-align-center slds-align_absolute-center">
                                                                        <lightning-input
                                                                            type="checkbox"
                                                                            variant="label-hidden"
                                                                            label={invoice.invoiceNumber}
                                                                            data-key={invoice.key}
                                                                            checked={invoice.isSelected}
                                                                            onchange={handleChildSelection}>
                                                                        </lightning-input>
                                                                        <lightning-button-icon
                                                                            icon-name={invoice.expandIcon}
                                                                            variant="bare"
                                                                            alternative-text={invoice.expandAltText}
                                                                            title={invoice.expandAltText}
                                                                            data-key={invoice.key}
                                                                            onclick={handleToggleRow}>
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </td>
                                                                <th scope="row">
                                                                    <button
                                                                        class="slds-button slds-button_reset slds-text-link"
                                                                        type="button"
                                                                        data-id={invoice.invoiceId}
                                                                        onclick={handleOpenInvoice}>
                                                                        {invoice.invoiceNumber}
                                                                    </button>
                                                                </th>
                                                                <td class="receivables-table__account">
                                                                    <div class="invoice-identity">
                                                                        <template if:true={invoice.accountId}>
                                                                            <button
                                                                                class="slds-button slds-button_reset slds-text-link invoice-identity__account"
                                                                                type="button"
                                                                                data-id={invoice.accountId}
                                                                                onclick={handleOpenAccount}>
                                                                                {invoice.accountName}
                                                                            </button>
                                                                        </template>
                                                                        <template if:false={invoice.accountId}>
                                                                            <span class="invoice-identity__account">{invoice.accountName}</span>
                                                                        </template>
                                                                        <div class="invoice-identity__detail">
                                                                            <template if:true={invoice.opportunityId}>
                                                                                <button
                                                                                    class="slds-button slds-button_reset slds-text-link invoice-identity__opportunity"
                                                                                    type="button"
                                                                                    data-id={invoice.opportunityId}
                                                                                    onclick={handleOpenOpportunity}>
                                                                                    {invoice.opportunityName}
                                                                                </button>
                                                                            </template>
                                                                            <template if:false={invoice.opportunityId}>
                                                                                <span class="invoice-identity__opportunity">{invoice.opportunityName}</span>
                                                                            </template>
                                                                            <template if:true={invoice.quoteDisplay}>
                                                                                <span class="invoice-identity__quote">{invoice.quoteDisplay}</span>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </td>
                                                                <td class="receivables-table__type">{invoice.invoiceType}</td>
                                                                <td class="receivables-table__date">
                                                                    <lightning-formatted-date-time value={invoice.invoiceDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                                </td>
                                                                <td class="receivables-table__date">
                                                                    <lightning-formatted-date-time value={invoice.dueDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                                </td>
                                                                <td class="receivables-table__num">
                                                                    <lightning-formatted-number value={invoice.daysOutstanding}></lightning-formatted-number>
                                                                </td>
                                                                <td class="receivables-table__num">
                                                                    <lightning-formatted-number value={invoice.totalAmount} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                                </td>
                                                                <td class="receivables-table__num">
                                                                    <lightning-formatted-number value={invoice.amountPaid} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                                </td>
                                                                <td class="receivables-table__num">
                                                                    <lightning-formatted-number value={invoice.balanceDue} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                                </td>
                                                                <td>{invoice.status}</td>
                                                            </tr>
                                                            <tr if:true={invoice.isExpanded} key={invoice.paymentRowKey} class="slds-theme_shade">
                                                                <td colspan="11">
                                                                    <div class="invoice-expand">
                                                                        <template if:true={invoice.hasAdditionalNarratives}>
                                                                            <template for:each={invoice.narrativeBlocks} for:item="block">
                                                                                <div key={block.key} class="invoice-expand__block">
                                                                                    <p class="invoice-expand__label">{block.opportunityName}</p>
                                                                                    <template if:true={block.showEmpty}>
                                                                                        <p class="invoice-expand__empty">No opportunity description available.</p>
                                                                                    </template>
                                                                                    <template if:false={block.showEmpty}>
                                                                                        <p class="invoice-expand__copy">{block.description}</p>
                                                                                    </template>
                                                                                </div>
                                                                            </template>
                                                                        </template>
                                                                        <template if:true={invoice.showGoverningDescription}>
                                                                            <p class="invoice-expand__copy">{invoice.governingDescription}</p>
                                                                        </template>
                                                                        <template if:true={invoice.showGoverningEmpty}>
                                                                            <p class="invoice-expand__empty">No opportunity description available.</p>
                                                                        </template>
                                                                        <template if:false={invoice.hasPayments}>
                                                                            <p class="invoice-expand__empty">No payments recorded.</p>
                                                                        </template>
                                                                        <template if:true={invoice.hasPayments}>
                                                                            <table class="slds-table slds-table_cell-buffer invoice-expand__payments">
                                                                                <thead>
                                                                                    <tr>
                                                                                        <th scope="col">Payment Date</th>
                                                                                        <th scope="col">Amount</th>
                                                                                        <th scope="col">Method</th>
                                                                                        <th scope="col">Reference</th>
                                                                                    </tr>
                                                                                </thead>
                                                                                <tbody>
                                                                                    <template for:each={invoice.payments} for:item="payment">
                                                                                        <tr key={payment.paymentId}>
                                                                                            <td>
                                                                                                <lightning-formatted-date-time value={payment.paymentDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                                                            </td>
                                                                                            <td>
                                                                                                <lightning-formatted-number value={payment.amountReceived} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                                                            </td>
                                                                                            <td>{payment.paymentMethod}</td>
                                                                                            <td>{payment.referenceNumber}</td>
                                                                                        </tr>
                                                                                    </template>
                                                                                </tbody>
                                                                            </table>
                                                                        </template>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </article>
                        </template>
                    </template>

                    <template if:true={isInvoiceView}>
                        <template if:true={invoiceViewEmpty}>
                            <p class="bucket-empty">No invoices match the current filters.</p>
                        </template>
                        <template if:false={invoiceViewEmpty}>
                            <div class="slds-scrollable_x bucket-table-host">
                                                <table class="slds-table slds-table_bordered slds-table_fixed-layout grouped-diary-table receivables-table receivables-table_invoice" aria-label="Receivables by invoice">
                                                    <colgroup>
                                                        <col style={receivableColumnStyles.select} />
                                                        <col style={receivableColumnStyles.invoice} />
                                                        <col style={receivableColumnStyles.salesperson} />
                                                        <col style={receivableColumnStyles.account} />
                                                        <col style={receivableColumnStyles.type} />
                                                        <col style={receivableColumnStyles.invoiceDate} />
                                                        <col style={receivableColumnStyles.dueDate} />
                                                        <col style={receivableColumnStyles.days} />
                                                        <col style={receivableColumnStyles.amount} />
                                                        <col style={receivableColumnStyles.paid} />
                                                        <col style={receivableColumnStyles.balance} />
                                                        <col style={receivableColumnStyles.status} />
                                                    </colgroup>
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.select}>
                                                                <span class="slds-assistive-text">Selection and expansion</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="select" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.invoice}>
                                                                <span class="grouped-diary-table__header-label">Invoice</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="invoice" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.salesperson}>
                                                                <span class="grouped-diary-table__header-label">Salesperson</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="salesperson" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.account}>
                                                                <span class="grouped-diary-table__header-label">Account</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="account" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.type}>
                                                                <span class="grouped-diary-table__header-label">Type</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="type" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.invoiceDate}>
                                                                <span class="grouped-diary-table__header-label">Invoice Date</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="invoiceDate" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.dueDate}>
                                                                <span class="grouped-diary-table__header-label">Due Date</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="dueDate" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.days}>
                                                                <span class="grouped-diary-table__header-label">Days</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="days" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.amount}>
                                                                <span class="grouped-diary-table__header-label">Amount</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="amount" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.paid}>
                                                                <span class="grouped-diary-table__header-label">Paid</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="paid" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header receivables-table__num" style={receivableColumnStyles.balance}>
                                                                <span class="grouped-diary-table__header-label">Balance</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="balance" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                            <th scope="col" class="grouped-diary-table__header bcc-resizable-header" style={receivableColumnStyles.status}>
                                                                <span class="grouped-diary-table__header-label">Status</span>
                                                                <span class="bcc-column-resize-handle" data-column-key="status" onmousedown={handleColumnResizeStart} title="Resize column"></span>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                    <tbody>
                                        <template for:each={filteredStatusInvoices} for:item="invoice">
                                            <tr key={invoice.key} class="slds-hint-parent">
                                                <td>
                                                    <div class="slds-grid slds-grid_vertical-align-center slds-align_absolute-center">
                                                        <lightning-input
                                                            type="checkbox"
                                                            variant="label-hidden"
                                                            label={invoice.invoiceNumber}
                                                            data-key={invoice.key}
                                                            checked={invoice.isSelected}
                                                            onchange={handleChildSelection}>
                                                        </lightning-input>
                                                        <lightning-button-icon
                                                            icon-name={invoice.expandIcon}
                                                            variant="bare"
                                                            alternative-text={invoice.expandAltText}
                                                            title={invoice.expandAltText}
                                                            data-key={invoice.key}
                                                            onclick={handleToggleRow}>
                                                        </lightning-button-icon>
                                                    </div>
                                                </td>
                                                <th scope="row">
                                                    <button
                                                        class="slds-button slds-button_reset slds-text-link"
                                                        type="button"
                                                        data-id={invoice.invoiceId}
                                                        onclick={handleOpenInvoice}>
                                                        {invoice.invoiceNumber}
                                                    </button>
                                                </th>
                                                <td>{invoice.ownerDisplayName}</td>
                                                <td class="receivables-table__account">
                                                    <div class="invoice-identity">
                                                        <template if:true={invoice.accountId}>
                                                            <button
                                                                class="slds-button slds-button_reset slds-text-link invoice-identity__account"
                                                                type="button"
                                                                data-id={invoice.accountId}
                                                                onclick={handleOpenAccount}>
                                                                {invoice.accountName}
                                                            </button>
                                                        </template>
                                                        <template if:false={invoice.accountId}>
                                                            <span class="invoice-identity__account">{invoice.accountName}</span>
                                                        </template>
                                                        <div class="invoice-identity__detail">
                                                            <template if:true={invoice.opportunityId}>
                                                                <button
                                                                    class="slds-button slds-button_reset slds-text-link invoice-identity__opportunity"
                                                                    type="button"
                                                                    data-id={invoice.opportunityId}
                                                                    onclick={handleOpenOpportunity}>
                                                                    {invoice.opportunityName}
                                                                </button>
                                                            </template>
                                                            <template if:false={invoice.opportunityId}>
                                                                <span class="invoice-identity__opportunity">{invoice.opportunityName}</span>
                                                            </template>
                                                            <template if:true={invoice.quoteDisplay}>
                                                                <span class="invoice-identity__quote">{invoice.quoteDisplay}</span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="receivables-table__type">{invoice.invoiceType}</td>
                                                <td class="receivables-table__date">
                                                    <lightning-formatted-date-time value={invoice.invoiceDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                </td>
                                                <td class="receivables-table__date">
                                                    <lightning-formatted-date-time value={invoice.dueDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                </td>
                                                <td class="receivables-table__num">
                                                    <lightning-formatted-number value={invoice.daysOutstanding}></lightning-formatted-number>
                                                </td>
                                                <td class="receivables-table__num">
                                                    <lightning-formatted-number value={invoice.totalAmount} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                </td>
                                                <td class="receivables-table__num">
                                                    <lightning-formatted-number value={invoice.amountPaid} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                </td>
                                                <td class="receivables-table__num">
                                                    <lightning-formatted-number value={invoice.balanceDue} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                </td>
                                                <td>{invoice.status}</td>
                                            </tr>
                                            <tr if:true={invoice.isExpanded} key={invoice.paymentRowKey} class="slds-theme_shade">
                                                <td colspan="12">
                                                    <div class="invoice-expand">
                                                        <template if:true={invoice.hasAdditionalNarratives}>
                                                            <template for:each={invoice.narrativeBlocks} for:item="block">
                                                                <div key={block.key} class="invoice-expand__block">
                                                                    <p class="invoice-expand__label">{block.opportunityName}</p>
                                                                    <template if:true={block.showEmpty}>
                                                                        <p class="invoice-expand__empty">No opportunity description available.</p>
                                                                    </template>
                                                                    <template if:false={block.showEmpty}>
                                                                        <p class="invoice-expand__copy">{block.description}</p>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </template>
                                                        <template if:true={invoice.showGoverningDescription}>
                                                            <p class="invoice-expand__copy">{invoice.governingDescription}</p>
                                                        </template>
                                                        <template if:true={invoice.showGoverningEmpty}>
                                                            <p class="invoice-expand__empty">No opportunity description available.</p>
                                                        </template>
                                                        <template if:false={invoice.hasPayments}>
                                                            <p class="invoice-expand__empty">No payments recorded.</p>
                                                        </template>
                                                        <template if:true={invoice.hasPayments}>
                                                            <table class="slds-table slds-table_cell-buffer invoice-expand__payments">
                                                                <thead>
                                                                    <tr>
                                                                        <th scope="col">Payment Date</th>
                                                                        <th scope="col">Amount</th>
                                                                        <th scope="col">Method</th>
                                                                        <th scope="col">Reference</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template for:each={invoice.payments} for:item="payment">
                                                                        <tr key={payment.paymentId}>
                                                                            <td>
                                                                                <lightning-formatted-date-time value={payment.paymentDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time>
                                                                            </td>
                                                                            <td>
                                                                                <lightning-formatted-number value={payment.amountReceived} format-style="currency" currency-code="USD" maximum-fraction-digits="2"></lightning-formatted-number>
                                                                            </td>
                                                                            <td>{payment.paymentMethod}</td>
                                                                            <td>{payment.referenceNumber}</td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                        </template>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>
                </div>
            </section>
        </template>
    </div>

    <template if:true={isSetAmountModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Set Invoice Amount</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small">{selectedInvoiceForAmount.invoiceNumber}</p>
                    <lightning-input
                        type="number"
                        label="Invoice Amount"
                        value={setAmountValue}
                        step="0.01"
                        required
                        onchange={handleSetAmountChange}>
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleSetAmountClose}></lightning-button>
                    <lightning-button class="slds-m-left_small" label="Save" variant="brand" onclick={handleSetAmountSave} disabled={isActionLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isPostReceiptModalOpen}>
        <c-billing-control-center-post-receipt-modal
            opportunity={selectedOpportunityForReceipt}
            onclose={handlePostReceiptClose}
            onrefresh={handlePostReceiptRefresh}>
        </c-billing-control-center-post-receipt-modal>
    </template>
</template>
