<template>
    <div class="control-center-card">
        <div class="hero">
            <div class="hero__intro">
                <p class="hero__eyebrow">Billing Control Center</p>
                <h1 class="hero__title">{heroTitle}</h1>
                <p class="hero__subtitle">{heroSubtitle}</p>
            </div>
            <div class="hero__controls">
                <c-billing-control-center-date-filter
                    compact
                    label="Date Range"
                    selected-filter-key={dateFilterKey}
                    start-date={dateFilterStart}
                    end-date={dateFilterEnd}
                    ondatefilterchange={handleDateFilterChange}>
                </c-billing-control-center-date-filter>
                <lightning-record-picker
                    class="owner-picker"
                    label="Opportunity Owner"
                    placeholder="Opportunity Owner"
                    object-api-name="User"
                    value={opportunityOwnerId}
                    display-info={userPickerDisplayInfo}
                    matching-info={userPickerMatchingInfo}
                    onchange={handleOpportunityOwnerChange}>
                </lightning-record-picker>
                <div class="view-by">
                    <p class="view-by__title">View by</p>
                    <p class="view-by__caption">WO View / Account view</p>
                    <div class="view-by__switch" role="group" aria-label="View by">
                        <button
                            type="button"
                            class={woViewButtonClass}
                            data-view="workOrder"
                            aria-pressed={isWorkOrderView}
                            onclick={handleListViewSelect}>
                            <span class="slds-assistive-text">Work order view</span>
                        </button>
                        <button
                            type="button"
                            class={accountViewButtonClass}
                            data-view="account"
                            aria-pressed={isAccountView}
                            onclick={handleListViewSelect}>
                            <span class="slds-assistive-text">Account view</span>
                        </button>
                        <span class={viewSwitchKnobClass} aria-hidden="true"></span>
                    </div>
                </div>
                <lightning-input
                    class="toolbar-search"
                    type="search"
                    label="Search"
                    variant="label-hidden"
                    placeholder="Search work order, account, opportunity, owner"
                    value={searchKey}
                    onchange={handleSearchChange}>
                </lightning-input>
                <template if:true={useExternalToolbar}>
                    <lightning-button
                        label={refreshLabel}
                        icon-name="utility:refresh"
                        variant="brand"
                        disabled={isLoading}
                        onclick={handleRefresh}>
                    </lightning-button>
                </template>
                <template if:false={useExternalToolbar}>
                    <c-billing-control-center-action-bar
                        actions={heroActions}
                        onactionclick={handleHeroActionClick}>
                    </c-billing-control-center-action-bar>
                </template>
            </div>
        </div>

        <template if:true={errorMessage}>
            <div class="slds-p-horizontal_large slds-p-bottom_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </div>
        </template>

        <c-billing-control-center-diagnostics
            warnings={providerWarnings}
            title="Configuration warnings detected"
            is-visible={showDiagnostics}>
        </c-billing-control-center-diagnostics>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading billing control center"></lightning-spinner>
        </template>

        <div class="billing-kpi-container">
            <c-billing-control-center-kpi-grid compact tiles={kpiTiles}></c-billing-control-center-kpi-grid>
        </div>

        <section class="table-shell">
            <div class="table-meta">
                <span>{searchSummary}</span>
            </div>

            <lightning-accordion class="bucket-accordion" allow-multiple-sections-open>
                <template for:each={accordionSections} for:item="section">
                    <lightning-accordion-section
                        key={section.bucketKey}
                        name={section.bucketKey}
                        label={section.titleWithCount}>
                            <div class="bucket-section-body">
                                <template if:true={section.isEmpty}>
                                    <p class="bucket-empty">No records in this bucket for the current filters.</p>
                                </template>
                                <template if:false={section.isEmpty}>
                                    <div class="slds-scrollable_x bucket-table-host">
                                        <table
                                            class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout grouped-diary-table"
                                            aria-label={section.sectionLabel}>
                                            <colgroup>
                                                <col class="grouped-diary-table__col grouped-diary-table__col--expand" />
                                                <template for:each={section.columns} for:item="column">
                                                    <col key={column.key} class={column.colClass} style={column.colStyle} />
                                                </template>
                                            </colgroup>
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th scope="col" class="grouped-diary-table__header grouped-diary-table__header--expand">
                                                        <span class="slds-assistive-text">Expand work type group</span>
                                                    </th>
                                                    <template for:each={section.columns} for:item="column">
                                                        <th
                                                            key={column.key}
                                                            scope="col"
                                                            class={column.headerClass}
                                                            style={column.headerStyle}
                                                            aria-sort={column.ariaSort}>
                                                            <template if:true={column.isLedgerAction}>
                                                                <span class="grouped-diary-table__header-label" title={column.label}>{column.label}</span>
                                                            </template>
                                                            <template if:false={column.isLedgerAction}>
                                                                <button
                                                                    class="slds-button slds-button_reset slds-grid slds-grid_align-spread grouped-diary-table__header-button"
                                                                    type="button"
                                                                    data-bucket={section.bucketKey}
                                                                    data-field={column.fieldName}
                                                                    onclick={handleHeaderSort}>
                                                                    <span class="grouped-diary-table__header-label" title={column.label}>{column.label}</span>
                                                                    <template if:true={column.isSorted}>
                                                                        <lightning-icon
                                                                            icon-name={column.sortIcon}
                                                                            size="xx-small"
                                                                            alternative-text={column.sortAltText}>
                                                                        </lightning-icon>
                                                                    </template>
                                                                </button>
                                                                <span
                                                                    class="bcc-column-resize-handle"
                                                                    data-column-key={column.developerKey}
                                                                    onmousedown={handleColumnResizeStart}
                                                                    title="Resize column"></span>
                                                            </template>
                                                        </th>
                                                    </template>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={section.workTypeGroups} for:item="group">
                                                    <tr key={group.key} class="slds-hint-parent grouped-diary-table__row grouped-diary-table__row--work-type-parent">
                                                        <td class="grouped-diary-table__cell grouped-diary-table__cell--expand">
                                                            <lightning-button-icon
                                                                icon-name={group.expandIcon}
                                                                variant="bare"
                                                                alternative-text={group.expandAltText}
                                                                title={group.expandAltText}
                                                                data-group-key={group.key}
                                                                onclick={handleToggleWorkTypeGroup}>
                                                            </lightning-button-icon>
                                                        </td>
                                                        <template for:each={section.columns} for:item="column">
                                                            <td key={column.key} class={column.cellClass} data-label={column.label}>
                                                                <template if:true={column.isLeadColumn}>
                                                                    <span class="grouped-diary-table__work-type-parent-label">{group.label}</span>
                                                                </template>
                                                                <template if:true={column.isWorkOrder}>
                                                                    <lightning-formatted-number value={group.rowCount}></lightning-formatted-number>
                                                                </template>
                                                                <template if:true={column.isOpportunityAmount}>
                                                                    <div class="grouped-diary-table__grouped-amount">
                                                                        <template if:true={group.hasAmount}>
                                                                            <lightning-formatted-number
                                                                                value={group.totalAmount}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </template>
                                                                        <template if:false={group.hasAmount}>
                                                                            <span class="grouped-diary-table__no-amount">----</span>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                                <template if:true={column.isVisitAmount}>
                                                                    <div class="grouped-diary-table__grouped-amount">
                                                                        <template if:true={group.hasVisitAmount}>
                                                                            <lightning-formatted-number
                                                                                value={group.totalVisitAmount}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </template>
                                                                        <template if:false={group.hasVisitAmount}>
                                                                            <span class="grouped-diary-table__no-amount">----</span>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </td>
                                                        </template>
                                                    </tr>
                                                    <template if:true={group.isExpanded}>
                                                <template for:each={group.rows} for:item="row">
                                                    <tr key={row.displayKey} class={row.rowClass}>
                                                        <td class="grouped-diary-table__cell grouped-diary-table__cell--expand"></td>
                                                        <template for:each={section.columns} for:item="column">
                                                            <td key={column.key} class={column.cellClass} data-label={column.label}>
                                                                <template if:true={column.isAccount}>
                                                                    <template if:true={row.showAccountName}>
                                                                        <div class="grouped-diary-table__single-value" title={row.accountName}>
                                                                            <template if:true={row.accountUrl}>
                                                                                <a
                                                                                    href={row.accountUrl}
                                                                                    target="_blank"
                                                                                    rel="noopener noreferrer"
                                                                                    class="slds-text-link grouped-diary-table__single-link"
                                                                                    title={row.accountName}>
                                                                                    {row.accountName}
                                                                                </a>
                                                                            </template>
                                                                            <template if:false={row.accountUrl}>
                                                                                <span class="grouped-diary-table__single-text">{row.accountName}</span>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </template>

                                                                <template if:true={column.isOpportunity}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--opportunity">
                                                                        <template for:each={row.relatedOpportunities} for:item="opportunity">
                                                                            <div key={opportunity.lineKey} class="grouped-diary-cell__line">
                                                                                <template if:true={opportunity.opportunityUrl}>
                                                                                    <a
                                                                                        href={opportunity.opportunityUrl}
                                                                                        target="_blank"
                                                                                        rel="noopener noreferrer"
                                                                                        class="slds-text-link grouped-diary-cell__value grouped-diary-cell__value--truncate"
                                                                                        title={opportunity.opportunityName}>
                                                                                        {opportunity.opportunityName}
                                                                                    </a>
                                                                                </template>
                                                                                <template if:false={opportunity.opportunityUrl}>
                                                                                    <span
                                                                                        class="grouped-diary-cell__value grouped-diary-cell__value--truncate"
                                                                                        title={opportunity.opportunityName}>
                                                                                        {opportunity.opportunityName}
                                                                                    </span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isWorkType}>
                                                                    <div class="grouped-diary-table__single-value" title={row.workTypeName}>
                                                                        <span class="grouped-diary-table__single-text">{row.workTypeName}</span>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isWorkOrder}>
                                                                    <div class="grouped-diary-table__work-order" title={row.workOrderNumber}>
                                                                        <template if:true={row.attentionRequired}>
                                                                            <lightning-icon
                                                                                class="grouped-diary-table__attention"
                                                                                icon-name="utility:warning"
                                                                                size="xx-small"
                                                                                alternative-text="Attention required"
                                                                                title={row.attentionReason}>
                                                                            </lightning-icon>
                                                                        </template>
                                                                        <div class="grouped-diary-table__single-value">
                                                                            <template if:true={row.workOrderUrl}>
                                                                                <a
                                                                                    href={row.workOrderUrl}
                                                                                    target="_blank"
                                                                                    rel="noopener noreferrer"
                                                                                    class="slds-text-link grouped-diary-table__single-link"
                                                                                    title={row.workOrderNumber}>
                                                                                    {row.workOrderNumber}
                                                                                </a>
                                                                            </template>
                                                                            <template if:false={row.workOrderUrl}>
                                                                                <span class="grouped-diary-table__single-text">{row.workOrderNumber}</span>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isServiceAppointment}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--service-appointment">
                                                                        <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                            <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                <template if:true={appointment.serviceAppointmentUrl}>
                                                                                    <a
                                                                                        href={appointment.serviceAppointmentUrl}
                                                                                        target="_blank"
                                                                                        rel="noopener noreferrer"
                                                                                        class="slds-text-link grouped-diary-cell__value grouped-diary-cell__value--service-appointment"
                                                                                        title={appointment.serviceAppointmentDisplay}>
                                                                                        {appointment.serviceAppointmentDisplay}
                                                                                    </a>
                                                                                </template>
                                                                                <template if:false={appointment.serviceAppointmentUrl}>
                                                                                    <span
                                                                                        class="grouped-diary-cell__value grouped-diary-cell__value--service-appointment"
                                                                                        title={appointment.serviceAppointmentDisplay}>
                                                                                        {appointment.serviceAppointmentDisplay}
                                                                                    </span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isEarliestStart}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--nowrap">
                                                                        <template if:true={row.earliestStartTime}>
                                                                            <span class="grouped-diary-cell__value grouped-diary-cell__value--nowrap">
                                                                                <lightning-formatted-date-time
                                                                                    value={row.earliestStartTime}
                                                                                    year="numeric"
                                                                                    month="2-digit"
                                                                                    day="2-digit"
                                                                                    hour="2-digit"
                                                                                    minute="2-digit">
                                                                                </lightning-formatted-date-time>
                                                                            </span>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isScheduledStart}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--nowrap">
                                                                        <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                            <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                <template if:true={appointment.schedStartTime}>
                                                                                    <span class="grouped-diary-cell__value grouped-diary-cell__value--nowrap">
                                                                                        <lightning-formatted-date-time
                                                                                            value={appointment.schedStartTime}
                                                                                            year="numeric"
                                                                                            month="2-digit"
                                                                                            day="2-digit"
                                                                                            hour="2-digit"
                                                                                            minute="2-digit">
                                                                                        </lightning-formatted-date-time>
                                                                                    </span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isActualStart}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--nowrap">
                                                                        <template for:each={row.relatedServiceAppointments} for:item="appointment">
                                                                            <div key={appointment.lineKey} class="grouped-diary-cell__line">
                                                                                <template if:true={appointment.actualStartTime}>
                                                                                    <span class="grouped-diary-cell__value grouped-diary-cell__value--nowrap">
                                                                                        <lightning-formatted-date-time
                                                                                            value={appointment.actualStartTime}
                                                                                            year="numeric"
                                                                                            month="2-digit"
                                                                                            day="2-digit"
                                                                                            hour="2-digit"
                                                                                            minute="2-digit">
                                                                                        </lightning-formatted-date-time>
                                                                                    </span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isSubject}>
                                                                    <div class="grouped-diary-table__single-value" title={row.subject}>
                                                                        <span class="grouped-diary-table__single-text">{row.subject}</span>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isOpportunityAmount}>
                                                                    <div class="grouped-diary-table__grouped-amount">
                                                                        <template if:true={row.hasOpportunityAmount}>
                                                                            <lightning-formatted-number
                                                                                value={row.opportunityAmountValue}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </template>
                                                                        <template if:false={row.hasOpportunityAmount}>
                                                                            <span
                                                                                class="grouped-diary-table__no-amount"
                                                                                title="No Opportunity linked to this Work Order">----</span>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isVisitAmount}>
                                                                    <div class="grouped-diary-table__grouped-amount">
                                                                        <template if:true={row.hasVisitAmount}>
                                                                            <lightning-formatted-number
                                                                                value={row.visitAmountValue}
                                                                                format-style="currency"
                                                                                currency-code="USD">
                                                                            </lightning-formatted-number>
                                                                        </template>
                                                                        <template if:false={row.hasVisitAmount}>
                                                                            <span
                                                                                class="grouped-diary-table__no-amount"
                                                                                title="No Opportunity linked to this Work Order">----</span>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isOwner}>
                                                                    <div class="grouped-diary-cell grouped-diary-cell--truncate">
                                                                        <span
                                                                            class="grouped-diary-cell__value grouped-diary-cell__value--truncate"
                                                                            title={row.accountOwnerName}>
                                                                            {row.accountOwnerName}
                                                                        </span>
                                                                    </div>
                                                                </template>

                                                                <template if:true={column.isLedgerAction}>
                                                                    <div class="ledger-action" data-ledger-id={row.ledgerId}>
                                                                        <lightning-button
                                                                            label="View Ledger"
                                                                            variant="neutral"
                                                                            onclick={handleViewLedger}
                                                                            disabled={row.isLedgerActionDisabled}>
                                                                        </lightning-button>
                                                                    </div>
                                                                </template>
                                                            </td>
                                                        </template>
                                                    </tr>
                                                </template>
                                                    </template>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                    </lightning-accordion-section>
                </template>
            </lightning-accordion>
        </section>
    </div>

    <template if:true={showLedgerModal}>
        <c-billing-control-center-ledger-modal
            date-filter={dateFilter}
            ledger-id={selectedLedgerId}
            onclose={handleCloseLedgerModal}>
        </c-billing-control-center-ledger-modal>
    </template>
</template>
