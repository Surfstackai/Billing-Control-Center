<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="ledger-modal-heading" class={dialogClass}>
        <div class={containerClass}>
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                </button>
                <h2 id="ledger-modal-heading" class="slds-text-heading_medium">Work Order Ledger</h2>
                <p class="slds-m-top_xx-small slds-text-body_small modal-subtitle">Accounting Reconciliation</p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={ledgerId}>
                    <c-work-order-ledger-related-work record-id={ledgerId}></c-work-order-ledger-related-work>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
                <template if:true={showOpenFullLedger}>
                    <lightning-button
                        class="slds-m-left_small"
                        label="Open Full Ledger"
                        variant="brand"
                        onclick={handleOpenFullLedger}
                        disabled={isOpenDisabled}>
                    </lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <template if:false={embedded}>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
